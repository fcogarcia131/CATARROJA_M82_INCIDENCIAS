        return '';

    // evita que la penúltima etiqueta se monte con la última
    if (i !== series.length - 1 && series.length - 1 - i < step * 0.6)
        return '';

    return `
        <text
            x="${x(i)}"
            y="${H - 28}"
            text-anchor="middle"
            fill="#5e7180"
            font-size="11">
            ${dateLabel(p.date)}
        </text>`;

}).join('');

    /* GRAFICO */
     
$('chart').innerHTML = `<title>${m}: evolución temporal</title>${grid}<path d="${path}" fill="none" stroke="#087f8c" stroke-width="1.2"/>${dots}${labels}<text x="${L}" y="16" fill="#172a3a" font-size="13">${m}</text>`;

     
      const fromText = from || 'Inicio';
      const toText = to || 'Actualidad';
      $('printFilters').innerHTML = `Parámetro: ${m} | Zona: ${z} | Desde: ${fromText} | Hasta: ${toText} | Valor: ${escapeHtml(condText())}`;
      report(pts.filter(valueOk)); $('chart').querySelectorAll('circle').forEach(el => {let show = () => {let p = series[+el.dataset.i], tip = $('tip'); tip.hidden = false; tip.textContent = `${dateFull(p.date)} | ${p.element} | ${fmt(p.value)}${p.out ? ' | FUERA DE RANGO' : ''}`; tip.style.left = `${(+el.getAttribute('cx') / 700) * 100}%`; tip.style.top = `${(+el.getAttribute('cy') / 330) * 100}%`}; el.onmouseenter = show; el.onfocus = show; el.onmouseleave = () => $('tip').hidden = true; el.onblur = () => $('tip').hidden = true})
    }

   


   
    fetch(source).then(r => {if (!r.ok) throw Error(r.status); return r.text()}).then(text => {
      let rows = csv(text), headers = rows.shift(); data = rows.flatMap(r => {
        let o = Object.fromEntries(headers.map((h, i) => [h, r[i] || ''])), date = iso(o['Fecha']), zone = o['ZONAS'];

        return Object.entries(names).map(([column, metric]) => ({
          date,
          zone,
          metric,
          raw: o[column],
          value: number(o[column]),
          element: o['ELEMENTOS'],
          responsible: o['Responsable']
        }))


          .filter(x =>
            x.date &&
            x.zone &&
            (
              x.raw !== '' ||
              Number.isFinite(x.value)
            )
          )
      }); 
     if (!data.length) throw Error('sin datos'); 
     options(); $('metric').onchange = render; 

const elementosInforme = [
  ...new Set(
    data
      .map(x => x.element)
      .filter(e => e && e.trim() !== '')
  )
].sort();

$('reportElement').innerHTML =
  '<option value="Todos">Todos</option>' +
  elementosInforme
    .map(e => `<option>${e}</option>`)
    .join('');







     const responsablesInforme = [
  ...new Set(
    data
      .map(x => x.responsible)
      .filter(r => r && r.trim() !== '')
  )
].sort();

$('reportResp').innerHTML =
  '<option value="Todos">Todos</option>' +
  responsablesInforme
    .map(r => `<option>${r}</option>`)
    .join('');
     
     $('reportMetric').onchange = () => {$('metric').value = $('reportMetric').value; 
     render()}; $('zone').onchange = render; 
     $('fromDate').onchange = render; 
     $('toDate').onchange = render; 

     $('reportElement').onchange = render;
     $('reportResp').onchange = render;
     $('reportCond').onchange = () => {condInputs(); render()};
     $('reportVal1').oninput = render;
     $('reportVal2').oninput = render;
     $('fechaDesde').onchange = render;
     $('fechaHasta').onchange = render;
     
     window.addEventListener('resize', render); render()
     
      
    }).catch(() => {$('status').textContent = 'No se han podido cargar los datos. Comprueba que la hoja de cálculo sigue publicada.'});

   
  </script>
</body>

</html>
